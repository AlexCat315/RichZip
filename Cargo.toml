[package]
name = "mugenzip"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
default-run = "mugenzip"
build = "build.rs"
publish = false

[package.metadata.cove]
id = "com.mugenzip.app"
name = "MugenZip"
build = 1
resources = ["assets"]

[workspace]
members = [".", "crates/core", "xtask"]

[dependencies]
cove-ui = { git = "https://github.com/AlexCat315/Cove", tag = "v0.3.1" }
mugenzip-core = { path = "crates/core" }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
