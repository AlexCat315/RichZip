[package]
name = "mugenzip"
version = "0.1.0"
edition = "2021"
default-run = "mugenzip"
build = "build.rs"

[dependencies]
slint = { version = "1.18", features = ["renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }
png = "0.17"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-ng"] }
sevenz-rust = { version = "0.6.1", default-features = false }
unrar-ng = { version = "0.7.7", default-features = false }
unrar-ng-sys = { version = "0.7.7", default-features = false, features = ["std"] }
widestring = "1"
tar = "0.4"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-ng"] }
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
