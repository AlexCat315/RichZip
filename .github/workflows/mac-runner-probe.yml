name: mac runner probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label:
          - macos-26
          - macos-26-arm64
          - macos-15
          - macos-latest
    runs-on: ${{ matrix.label }}
    steps:
      - name: Report host
        run: |
          uname -m
          sw_vers
          echo "LABEL=${{ matrix.label }}"
