<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MugenZip · 工作流原型</title>
<style>
  :root{
    --bg:#FBFAF7; --surface:#FFFFFE; --variant:#F0EEE8; --sunken:#F7F5F0;
    --line:#E2DFD5; --line-soft:#EDEAE0;
    --text:#1A1917; --muted:#4E4B44; --weak:#76736A;
    --accent:#1F5145; --accent-soft:rgba(31,81,69,.08); --danger:#9C3B2E;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --sidebar:250px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:-apple-system,"SF Pro Text","PingFang SC","Segoe UI",system-ui,sans-serif;
    color:var(--text); background:#E7E5E0;
    background-image:radial-gradient(120% 90% at 20% 0%,#EFEDE8 0%,#E3E1DB 55%,#D9D7D1 100%);
    display:flex; align-items:center; justify-content:center; padding:40px 24px 96px;
    -webkit-font-smoothing:antialiased;
  }
  .win{
    width:min(1180px,100%); height:min(740px,calc(100vh - 140px)); min-height:520px;
    border-radius:12px; position:relative; overflow:hidden;
    background:rgba(240,238,232,.62);
    backdrop-filter:blur(34px) saturate(140%); -webkit-backdrop-filter:blur(34px) saturate(140%);
    box-shadow:0 32px 70px -28px rgba(24,22,18,.55), 0 2px 6px rgba(24,22,18,.12), 0 0 0 .5px rgba(24,22,18,.10);
    display:grid; grid-template-columns:var(--sidebar) 1fr;
  }
  body[data-os="win"] .win{border-radius:8px; background:#F4F2EC}
  body[data-state="empty"] .win{grid-template-columns:1fr}
  body[data-state="empty"] .side{display:none}


  /* ---------- 交通灯 / Windows 按钮 ---------- */
  .lights{position:absolute; top:14px; left:16px; display:flex; gap:8px; z-index:5}
  .light{width:12px;height:12px;border-radius:50%;border:.5px solid rgba(0,0,0,.14)}
  .light.r{background:#FF5F57}.light.y{background:#FEBC2E}.light.g{background:#28C840}
  body[data-os="win"] .lights{display:none}
  .captions{display:none; position:absolute; top:0; right:0; height:34px; z-index:5}
  body[data-os="win"] .captions{display:flex}
  .cap{width:46px;height:34px;display:grid;place-items:center;color:#4A4A48;font-size:11px;cursor:default}
  .cap:hover{background:rgba(0,0,0,.06)}
  .cap.close:hover{background:#C42B1C;color:#fff}

  /* ---------- 左栏：输出去向 + 任务 ---------- */
  .side{
    position:relative; z-index:2; padding:44px 12px 12px;
    display:flex; flex-direction:column; gap:4px; overflow-y:auto; min-height:0;
  }
  .side::-webkit-scrollbar{width:0}
  .label{
    font-size:11.5px; font-weight:500; color:var(--weak);
    letter-spacing:.04em; padding:0 8px; margin:14px 0 6px;
  }
  .label:first-of-type{margin-top:0}
  .side-row{
    display:flex; align-items:center; gap:8px; height:32px; padding:0 8px;
    border-radius:var(--r-sm); font-size:12.5px; color:var(--text);
    cursor:default; transition:background .12s ease;
  }
  .side-row:hover{background:rgba(31,81,69,.06)}
  .side-row .ico{width:15px;height:15px;color:var(--weak);flex:none}
  .side-row .txt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .side-row .hint{font-size:11.5px;color:var(--weak);flex:none}
  .side-row.rec{align-items:flex-start; padding:5px 8px; height:auto; gap:6px}
  .rec-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
  .rec-l1{display:flex; align-items:baseline; gap:6px; min-width:0; line-height:1.35}
  .rec-l1 .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px}
  .rec-l1 .tm{font-size:11px; color:var(--weak); flex:none}
  .rec-l2{font-size:11px; line-height:1.35; color:var(--weak); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .side-row.on{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .side-row.on .ico,.side-row.on .hint{color:var(--accent)}
  .side-row.action{padding-left:8px}
  .side-row.action .txt{color:var(--weak)}
  .side-row.action:hover .txt{color:var(--text)}
  .tick{width:13px;height:13px;color:var(--accent);opacity:0;transition:opacity .12s ease;flex:none}
  .side-row.on .tick{opacity:1}
  .side{display:flex; flex-direction:column}
  #archives{flex:none}
  #side-open{margin-top:auto; margin-bottom:2px}
  .arc{
    display:flex; flex-direction:column; gap:4px;
    padding:7px 8px; border-radius:8px; cursor:default;
  }
  .arc:hover{background:rgba(31,81,69,.05)}
  .arc.on{background:var(--accent-soft)}
  .arc-l1{display:flex; align-items:center; gap:7px; min-width:0}
  .arc-l1 svg{width:15px;height:15px;flex:none; color:var(--weak)}
  .arc.on .arc-l1 svg{color:var(--accent)}
  .arc-l1 .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:12.5px; font-weight:600; color:var(--text)}
  .arc.on .arc-l1 .nm{color:var(--accent)}
  .arc-l1 .pct{font-size:11px; color:var(--weak); font-variant-numeric:tabular-nums; flex:none}
  .arc-l2{font-size:11px; color:var(--weak); padding-left:22px;
    display:flex; align-items:center; gap:8px; justify-content:space-between}
  .arc-l2 .grow{flex:1}
  .arc.reveal .arc-l2{color:var(--accent); padding-left:22px; cursor:default}
  .arc-l2 span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .arc .bar{margin:2px 0 1px 0}
  .chip{
    display:flex; align-items:center; gap:5px; height:26px; padding:0 6px;
    border:none; background:none; font-family:inherit; font-size:12.5px;
    color:var(--muted); border-radius:6px; cursor:default; white-space:nowrap;
  }
  .chip:hover{background:var(--accent-soft); color:var(--accent)}
  .chip svg{width:14px;height:14px;flex:none}
  .chip .caret{width:12px;height:12px;opacity:.7}
  .chip b{font-weight:600; color:inherit}
  .side-empty{
    font-size:12px; color:var(--weak); padding:2px 8px 0; line-height:1.6;
  }

  /* 任务卡 */
  .job{
    margin:0 4px; padding:10px; border-radius:var(--r-md);
    background:var(--surface); border:.5px solid var(--line);
    display:flex; flex-direction:column; gap:8px;
  }
  .job-line{display:flex; align-items:center; gap:8px; font-size:12.5px}
  .job-line .ico{width:15px;height:15px;color:var(--muted);flex:none}
  .job-line .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .job-line .pct{font-size:11.5px;color:var(--weak);font-variant-numeric:tabular-nums}
  .bar{height:3px;border-radius:2px;background:var(--variant);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;
    transition:width .1s linear;
    transition:width .9s cubic-bezier(.4,0,.2,1)}
  .job-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--weak);
    flex-wrap:wrap; row-gap:3px}
  .job-meta .wide{flex:1 0 100%}
  .job-meta .grow{flex:1}
  .link{color:var(--accent);font-size:11.5px;cursor:default;border:none;background:none;
    padding:0;font-family:inherit;white-space:nowrap}
  .link:hover{text-decoration:underline}
  .job.done .badge{width:15px;height:15px;color:var(--accent)}

  /* ---------- 右卡片 ---------- */
  .card{
    margin-top:52px;
    margin:8px; background:var(--bg); border-radius:var(--r-lg);
    border:.5px solid var(--line); overflow:hidden;
    display:flex; flex-direction:column; min-height:0;
    box-shadow:0 1px 2px rgba(24,22,18,.04);
  }
  body[data-os="win"] .card{border-radius:8px}

  .bar-top{
    display:flex; align-items:center; gap:8px; padding:14px 20px 12px; min-height:56px;
  }
  .title-wrap{display:flex; align-items:center; gap:10px; min-width:0}
  .id-col{display:flex; flex-direction:column; gap:2px; min-width:0}
  .back{width:22px;height:22px;display:grid;place-items:center;border:none;background:none;
    border-radius:var(--r-sm);color:var(--text);cursor:default;flex:none}
  .back:hover{background:rgba(26,25,23,.06)}
  .back.hidden{visibility:hidden}
  .back svg{width:15px;height:15px}
  .title{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .sub{font-size:12px;color:var(--weak);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1}

  .tools{display:flex;align-items:center;gap:2px;flex:none}
  .search{
    display:flex;align-items:center;gap:6px; height:28px; width:200px; padding:0 9px;
    border-radius:var(--r-sm); border:.5px solid var(--line); background:var(--surface);
    color:var(--weak); margin-right:6px; transition:border-color .12s ease,box-shadow .12s ease;
  }
  .search:focus-within{border-color:#C9C4B4; box-shadow:0 0 0 3px rgba(31,81,69,.08)}
  .search svg{width:13px;height:13px;flex:none}
  .search input{border:none;background:none;outline:none;font-size:12px;color:var(--text);width:100%;font-family:inherit}
  .search input::placeholder{color:var(--weak)}
  .btn{
    display:flex;align-items:center;gap:6px; height:28px; padding:0 8px;
    border:none; background:none; border-radius:var(--r-sm); font-size:12px; color:var(--text);
    font-family:inherit; cursor:default; transition:background .12s ease,color .12s ease;
  }
  .btn:hover{background:rgba(26,25,23,.06)}
  .btn svg{width:14px;height:14px;color:var(--muted)}
  .btn:hover svg{color:var(--text)}
  .btn:disabled{color:#B9B6AC;cursor:default;background:none}
  .btn:disabled svg{color:#C6C3B9}
  .btn.primary{color:var(--accent);font-weight:500}
  .btn.primary svg{color:var(--accent)}
  .btn.primary:disabled{color:#B9B6AC}

  .crumbs{
    display:flex;align-items:center;gap:6px; height:34px; padding:0 20px;
    font-size:12px; color:var(--muted); border-bottom:.5px solid var(--line-soft);
  }
  .crumbs .sep{color:#C2BFB3}
  .crumbs .here{color:var(--text);font-weight:600}
  .crumbs .right{margin-left:auto;color:var(--weak);font-variant-numeric:tabular-nums}
  .crumbs .done-note{display:flex;align-items:center;gap:12px;color:var(--accent)}
  .crumbs .done-note .link{color:var(--accent)}

  .progressbar{display:flex; align-items:center; gap:10px; padding:7px 20px;
    border-top:.5px solid var(--line); background:var(--sunken);
    font-size:11.5px; color:var(--muted)}
  .progressbar .bar{flex:1; height:3px; border-radius:2px; background:var(--variant); overflow:hidden}
  .progressbar .bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear}
  .progressbar .pb-pct{font-variant-numeric:tabular-nums; color:var(--weak)}
  .table{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
  .thead{
    display:grid; grid-template-columns:1fr 92px 128px; align-items:center;
    height:30px; padding:0 20px; background:var(--sunken);
    border-bottom:.5px solid var(--line);
    font-size:12px; color:var(--weak);
  }
  .thead .num{text-align:right}
  .thead.b5, .row.b5{grid-template-columns:24px minmax(0,1fr) 64px 64px 84px 100px}
  .thead.b5{gap:10px}
  .row.b5{gap:10px}
  .chk{width:14px;height:14px;border:.5px solid #CFCBBC;border-radius:4px;background:#FFFFFE}
  .chk.on{background:var(--accent);border-color:var(--accent);display:grid;place-items:center}
  .chk.on svg{width:10px;height:10px;color:#fff}
  .stat{font-size:11px;color:var(--weak);text-align:right}
  .stat.ok{color:var(--accent)}
  .batchbar{
    display:flex; align-items:center; gap:10px; padding:8px 20px;
    border-top:.5px solid var(--line); background:var(--sunken); font-size:12px; color:var(--muted);
  }
  .batchbar .grow{flex:1}
  .tbody{overflow-y:auto; flex:1}
  .tbody::-webkit-scrollbar{width:10px}
  .tbody::-webkit-scrollbar-thumb{background:rgba(26,25,23,.14);border-radius:5px;border:2px solid var(--bg)}
  .row{
    display:grid; grid-template-columns:1fr 92px 128px; align-items:center;
    height:38px; padding:0 20px; font-size:12.5px; cursor:default;
    border-bottom:.5px solid rgba(226,223,213,.6);
    transition:background .1s ease;
  }
  .row:hover{background:var(--sunken)}
  .row.sel{background:#EFEDE5}
  .row.sel .nm{font-weight:600}
  .nm{display:flex;align-items:center;gap:8px;min-width:0}
  .nm svg{width:15px;height:15px;flex:none;color:var(--weak)}
  .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num{text-align:right;color:var(--weak);font-variant-numeric:tabular-nums}
  .blank{display:grid;place-items:center;height:100%;color:var(--weak);font-size:12.5px}

  /* 空态：只剩标题行 */
  .empty-space{flex:1; padding:16px 20px 20px; display:flex; align-items:center; justify-content:center}
  .dropzone{
    width:420px; height:196px;
    border-color:#D3CFC0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; padding:0;
    background:none; font-family:inherit; cursor:default;
    border:1px dashed #D8D4C6; border-radius:var(--r-lg);
    color:var(--muted); transition:border-color .14s ease,background .14s ease,color .14s ease;
  }
  .dropzone:hover{border-color:var(--accent); background:rgba(31,81,69,.04); color:var(--accent)}
  .dropzone svg{width:26px;height:26px;color:inherit;opacity:.8}
  .dz-title{font-size:13.5px; font-weight:600; color:inherit; letter-spacing:.01em}
  .dz-sub{font-size:12px; color:var(--weak)}

  /* ---------- 轻提示 / 选择面板 ---------- */
  .toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(6px);
    background:rgba(26,25,23,.9); color:#fff; font-size:12px; padding:8px 14px;
    border-radius:8px; opacity:0; transition:opacity .16s ease,transform .16s ease; pointer-events:none;
    z-index:30;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .veil{
    position:fixed; inset:0; background:rgba(26,25,23,.18);
    display:none; place-items:center; z-index:20;
  }
  .veil.show{display:grid}
  .sheet{
    width:380px; background:var(--bg); border-radius:12px; overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(24,22,18,.5), 0 0 0 .5px rgba(24,22,18,.16);
  }
  .sheet h3{margin:0; padding:14px 16px 10px; font-size:13px; font-weight:600}
  .sheet .list{padding:0 8px 8px; max-height:280px; overflow:auto}
  .sheet .item{
    display:flex; align-items:center; gap:9px; height:34px; padding:0 10px; border-radius:6px;
    font-size:12.5px; cursor:default;
  }
  .sheet .item:hover{background:var(--accent-soft)}
  .sheet .item svg{width:15px;height:15px;color:var(--muted);flex:none}
  .sheet .item .m{margin-left:auto;font-size:11.5px;color:var(--weak)}
  .sheet .foot{display:flex; justify-content:flex-end; gap:8px; padding:10px 12px;
    border-top:.5px solid var(--line-soft)}
  .sheet .ghost{border:none;background:none;font-family:inherit;font-size:12px;color:var(--weak);
    padding:5px 10px;border-radius:6px;cursor:default}
  .sheet .ghost:hover{background:rgba(26,25,23,.06)}

  /* ---------- 原型状态条 ---------- */
  .proto{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px; padding:6px; border-radius:999px;
    background:rgba(255,255,255,.72); backdrop-filter:blur(16px);
    box-shadow:0 10px 30px -12px rgba(24,22,18,.35), 0 0 0 .5px rgba(24,22,18,.12);
    font-size:12px;
  }
  .pill{
    border:none;background:none;font-family:inherit;font-size:12px;color:var(--muted);
    padding:5px 11px;border-radius:999px;cursor:pointer;transition:background .12s,color .12s;
  }
  .pill:hover{background:rgba(26,25,23,.06)}
  .pill.on{background:var(--accent);color:#fff;font-weight:500}
  .divider{width:.5px;height:16px;background:var(--line)}
  .os-label{color:var(--weak);padding-left:4px}
</style>
</head>
<body data-state="open" data-os="mac">

<div class="win">
  <div class="lights"><i class="light r"></i><i class="light y"></i><i class="light g"></i></div>
  <div class="captions"><div class="cap">—</div><div class="cap">▢</div><div class="cap close">✕</div></div>

  <!-- ================= 左栏：解压到 / 任务 ================= -->
  <aside class="side">
    <div class="label">位置</div>
    <div id="locations">
      <div class="side-row on" data-loc="0">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M4.5 18.5h15"/></svg>
        <span class="txt">下载</span><span class="hint">6</span>
      </div>
      <div class="side-row" data-loc="1">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="12" rx="1.5"/><path d="M8 20h8"/></svg>
        <span class="txt">桌面</span><span class="hint">2</span>
      </div>
      <div class="side-row" data-loc="2">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="9" width="18" height="8" rx="2"/><circle cx="17.5" cy="13" r="1.1"/></svg>
        <span class="txt">外置硬盘</span><span class="hint">—</span>
      </div>
    </div>
    <div class="side-row action" id="side-open">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7.5h6l2 2.5h8v9H4z"/><path d="M12 11.5v4M10 13.5h4" stroke-width="1.4"/></svg>
      <span class="txt">添加文件夹…</span>
    </div>
  </aside>

  <!-- ================= 右：卡片 ================= -->
  <section class="card">
    <div class="bar-top">
      <div class="title-wrap">
        <button class="back hidden" id="back" aria-label="上一级">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.5 5.5L7.5 12l7 6.5"/></svg>
        </button>
        <div class="id-col">
          <span class="title" id="title">MugenZip</span>
          <span class="sub" id="sub">简单、快速的压缩包工具</span>
        </div>
      </div>
      <span class="grow"></span>
      <div class="tools">
        <label class="search" id="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l4 4"/></svg>
          <input id="search" type="text" placeholder="搜索" autocomplete="off">
        </label>
        <button class="btn" id="btn-open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9.5h17"/></svg>
          打开
        </button>
        <button class="chip" id="dest-chip" title="更改解压位置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7.5h6l2 2.5h8v9H4z"/></svg>
          <span>解压到 <b id="dest-name">HaHa</b></span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 10l5 5 5-5"/></svg>
        </button>
        <button class="btn primary" id="btn-extract">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v9"/><path d="M8 10l4 4 4-4"/><path d="M4.5 17.5h15"/></svg>
          解压
        </button>
        <button class="btn" id="btn-more">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          更多
        </button>
      </div>
    </div>

    <div class="crumbs" id="crumbs">
      <span class="here">HaHa.zip</span>
      <span class="right" id="count">2 个文件夹 · 0 个文件</span>
    </div>

    <div class="progressbar" id="progressbar" style="display:none">
      <span class="pb-note" id="pb-note">解压中 · 0 / 14,109 项</span>
      <div class="bar"><i id="fill"></i></div>
      <span class="pb-pct" id="pct">0%</span>
      <button class="link" id="cancel">取消</button>
    </div>

    <div class="table" id="table">
      <div class="thead"><span>名称</span><span class="num">大小</span><span class="num">修改日期</span></div>
      <div class="tbody" id="tbody"></div>
    </div>
    <div class="batchbar" id="batchbar" style="display:none">
      <span id="batch-note">已选 2 个</span><span class="grow"></span>
      <button class="chip" id="batch-dest">
        <span>解压到 <b id="batch-dest-name">HaHa</b></span>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <button class="btn primary" id="batch-go">解压</button>
    </div>

    <div class="empty-space" id="empty-space">
      <button class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M12 4.5v5"/><path d="M9.5 7.5h5"/>
        </svg>
        <span class="dz-title">打开压缩包</span>
        <span class="dz-sub" id="dz-sub">拖到这里，或按 ⌘O</span>
      </button>
    </div>
  </section>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<!-- ================= 原型状态 ================= -->
<div class="proto">
  <button class="pill" data-set="empty">空态</button>
  <button class="pill" data-set="browse">位置</button>
  <button class="pill on" data-set="open">已打开</button>
  <button class="pill" data-set="running">解压中</button>
  <button class="pill" data-set="done">已完成</button>
  <span class="divider"></span>
  <button class="pill on" data-os-set="mac">macOS</button>
  <button class="pill" data-os-set="win">Windows</button>
  <span class="divider"></span>
  <span class="os-label" id="os-label">访达 · ⌘O</span>
</div>

<script>
const rootRows = [
  {kind:'folder', name:'__MACOSX', size:'—', date:'今天 09:41'},
  {kind:'folder', name:'HaHa', size:'—', date:'今天 09:41'}
];
const hahaRows = [
  {kind:'folder', name:'assets', size:'—', date:'今天 09:41'},
  {kind:'file',   name:'index.html', size:'2 KB', date:'今天 09:41'},
  {kind:'file',   name:'README.md', size:'1 KB', date:'今天 09:41'},
  {kind:'folder', name:'node_modules', size:'—', date:'昨天 22:10'},
  {kind:'file',   name:'package.json', size:'1 KB', date:'昨天 22:10'}
];

const el = id => document.getElementById(id);
let state = 'open', os = 'mac', path = '', selected = null, q = '', dest = 0, timer = null;

const icoFolder = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7.5h6l2 2.5h8v9H4z"/></svg>';
const icoFile = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 4h7l4 4v12h-11z"/><path d="M13 4v4h4"/></svg>';
const icoCheck = '<svg class="badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7.5"/><path d="M8.5 12.2l2.6 2.6 4.6-4.8"/></svg>';
const icoClock = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7.5"/><path d="M12 7.5V12l3 2"/></svg>';
const icoArchive = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M12 4.5v4"/></svg>';

function rows(){
  const list = path ? hahaRows : rootRows;
  if(!q) return list;
  return list.filter(r => r.name.toLowerCase().includes(q.toLowerCase()));
}

function renderTable(){
  if(state === 'browse'){
    el('table').style.display = 'flex'; el('empty-space').style.display = 'none';
    el('progressbar').style.display = 'none';
    el('table').querySelector('.thead').outerHTML =
      '<div class="thead b5"><span></span><span>名称</span><span class="num">内容</span>'
      + '<span class="num">大小</span><span class="num">状态</span><span class="num">修改时间</span></div>';
    el('tbody').innerHTML = PAKGS.map((k,i)=>{
      const on = pkgSel.has(i);
      return `<div class="row b5" data-i="${i}">
        <span class="chk${on?' on':''}">${on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7"/></svg>':''}</span>
        <span class="nm">${icoArchive}<span>${k.name}</span></span>
        <span class="num">${k.items}</span>
        <span class="num">${k.size}</span>
        <span class="stat${k.state?' ok':''}">${k.state || '未处理'}</span>
        <span class="num">${k.when}</span></div>`;
    }).join('');
    el('tbody').querySelectorAll('.row').forEach(row=>{
      const i = Number(row.dataset.i);
      row.addEventListener('click', e=>{
        if(!e.metaKey && !e.shiftKey){ pkgSel.clear(); }
        if(pkgSel.has(i)) pkgSel.delete(i); else pkgSel.add(i);
        renderTable(); batchSync();
      });
      row.addEventListener('dblclick', ()=>{ pkgSel.clear(); setState('open'); });
    });
    return;
  }
  if(state === 'empty'){ el('table').style.display='none'; el('empty-space').style.display='flex'; return; }
  el('table').style.display='flex'; el('empty-space').style.display='none';
  el('tbody').innerHTML = rows().map((r,i)=>{
    const ic = r.kind === 'folder' ? icoFolder : icoFile;
    const cls = (selected === r.name ? ' sel' : '');
    return `<div class="row${cls}" data-name="${r.name}" data-kind="${r.kind}">
      <span class="nm">${ic}<span>${r.name}</span></span>
      <span class="num">${r.size}</span><span class="num">${r.date}</span></div>`;
  }).join('') || '<div class="blank">没有匹配的项目</div>';
  el('tbody').querySelectorAll('.row').forEach(row=>{
    row.addEventListener('click', ()=>{ selected = row.dataset.name; renderTable(); syncButtons(); });
    row.addEventListener('dblclick', ()=>{
      if(row.dataset.kind === 'folder' && !path){ path = row.dataset.name; selected = null; renderAll(); }
    });
  });
}

function syncButtons(){
  const opened = state !== 'empty';
  const inPkg = state === 'open' || state === 'running' || state === 'done';
  el('dest-name').textContent = destName();
  el('search-wrap').style.display = opened ? 'flex' : 'none';
  el('dest-chip').style.display = inPkg ? 'flex' : 'none';
  el('btn-extract').style.display = inPkg ? 'flex' : 'none';
  el('btn-open').style.display = opened ? 'flex' : 'none';
  el('btn-more').style.display = inPkg ? 'flex' : 'none';
  const canExtract = state === 'open' && selected !== null;
  el('btn-extract').disabled = !canExtract;
  el('btn-open').disabled = false;
}

function renderHead(){
  const opened = state !== 'empty';
  if(state === 'browse'){
    el('title').textContent = '下载';
    el('sub').textContent = '6 个压缩包 · 共 1.2 GB';
    el('crumbs').style.display = 'none';
    el('progressbar').style.display = 'none';
    return;
  }
  el('back').classList.toggle('hidden', !path);
  if(!opened){
    el('dz-sub').textContent = '拖到这里，或按 ' + (os === 'mac' ? '⌘O' : 'Ctrl+O');
    el('title').textContent = 'MugenZip';
    el('sub').textContent = '简单、快速的压缩包工具';
    el('crumbs').style.display = 'none';
    return;
  }
  el('title').textContent = 'HaHa.zip';
  el('sub').textContent = 'ZIP · 14109 项 · 126 MB';
  el('crumbs').style.display = 'flex';
  const c = rows();
  const f = c.filter(r=>r.kind==='folder').length, n = c.length - f;
  el('crumbs').innerHTML = (path
      ? `<span>HaHa.zip</span><span class="sep">›</span><span class="here">${path}</span>`
      : `<span class="here">HaHa.zip</span>`)
    + (state === 'done'
      ? `<span class="right done-note">已完成 · 14,109 项 · 跳过 3 个链接<button class="link" id="reveal">在${os==='mac'?'访达':'资源管理器'}显示</button></span>`
      : `<span class="right">${f} 个文件夹 · ${n} 个文件</span>`);
  const rv = el('reveal');
  if(rv) rv.onclick = ()=>toast('将在' + (os==='mac'?'访达':'资源管理器') + ' 中打开 HaHa');
}

const PAKGS = [
  {name:'HaHa.zip',      items:'14,109', size:'126 MB', state:'', when:'今天 09:41'},
  {name:'设计稿打包.zip', items:'312',    size:'88 MB',  state:'已解压', when:'今天 08:12', to:'设计稿'},
  {name:'rz-demo.zip',   items:'8',       size:'4 KB',   state:'已解压', when:'昨天 22:10', to:'rz-demo'},
  {name:'node_modules.zip', items:'21,884', size:'312 MB', state:'', when:'昨天 18:03'},
  {name:'素材包.zip',    items:'1,204',   size:'540 MB', state:'已解压', when:'11月13日', to:'素材包'},
  {name:'旧项目备份.zip', items:'5,960',  size:'214 MB', state:'', when:'11月09日'}
];
let pkgSel = new Set();

function renderLocations(){
  el('locations').querySelectorAll('[data-loc]').forEach(row=>{
    row.onclick = ()=>{
      if(!row.classList.contains('on')){
        el('locations').querySelectorAll('[data-loc]').forEach(r=>r.classList.remove('on'));
        row.classList.add('on');
        toast('演示原型：这里只有「下载」放了示例压缩包');
      }
    };
  });
}

function batchSync(){
  const on = state === 'browse' && pkgSel.size > 0;
  el('batchbar').style.display = on ? 'flex' : 'none';
  el('batch-note').textContent = '已选 ' + pkgSel.size + ' 个压缩包';
  el('batch-dest-name').textContent = destName();
}

function renderProgress(){
  const bar = el('progressbar');
  if(state !== 'running'){ bar.style.display='none'; return; }
  bar.style.display = 'flex';
  el('pb-note').textContent = '解压中 · 0 / 14,109 项';
  el('pct').textContent = '0%';
  el('fill').style.width = '0%';
  let shown = 0;
  const tick = setInterval(()=>{
    shown = Math.min(14109, shown + 470);
    el('pb-note').textContent = '解压中 · ' + shown.toLocaleString() + ' / 14,109 项';
    el('pct').textContent = Math.round(shown/14109*100) + '%';
    el('fill').style.width = (shown/14109*100).toFixed(1) + '%';
    if(shown >= 14109) clearInterval(tick);
  }, 130);
  timer = tick;
  el('cancel').onclick = ()=>{ clearInterval(tick); setState('open'); };
}

function renderAll(){
  document.body.dataset.state = state;
  renderHead(); renderTable(); renderProgress(); renderLocations(); batchSync(); syncButtons();
}

function setState(next){
  if(timer){ clearInterval(timer); timer=null; }
  state = next;
  if(next === 'empty'){ path=''; selected=null; q=''; el('search').value=''; }
  if(next === 'open'){ path=''; selected=null; pkgSel.clear(); }
  if(next === 'browse'){ path=''; selected=null; pkgSel.clear(); }
  if(next === 'done'){ selected=null; }
  renderAll();
  document.querySelectorAll('[data-set]').forEach(b=>b.classList.toggle('on', b.dataset.set===state));
}

function setOs(next){
  os = next; document.body.dataset.os = os;
  el('os-label').textContent = os === 'mac' ? '访达 · ⌘O' : '资源管理器 · Ctrl+O';
  if(state === 'empty'){ el('dz-sub').textContent = '拖到这里，或按 ' + (os === 'mac' ? '⌘O' : 'Ctrl+O'); }
  document.querySelectorAll('[data-os-set]').forEach(b=>b.classList.toggle('on', b.dataset.osSet===os));
  renderLocations(); batchSync();
}

document.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>setState(b.dataset.set)));
document.querySelectorAll('[data-os-set]').forEach(b=>b.addEventListener('click',()=>setOs(b.dataset.osSet)));

el('dest-chip').addEventListener('click', ()=>sheet('dir'));
el('side-open').addEventListener('click', ()=>toast('演示原型：这里会打开「选择文件夹」面板'));
el('batch-dest').addEventListener('click', ()=>sheet('dir'));
el('batch-go').addEventListener('click', ()=>{ if(pkgSel.size) setState('running'); });
const FILES = [
  {name:'HaHa.zip', meta:'126 MB · 今天 09:41'},
  {name:'rz-demo.zip', meta:'4 KB · 昨天 22:10'}
];
const PLACES = [
  {name:'HaHa', meta:'当前文件夹'},
  {name:'桌面', meta:'~/Desktop'},
  {name:'下载', meta:'~/Downloads'},
  {name:'选择其他文件夹…', meta:''}
];
const destName = ()=> dest === 0 ? 'HaHa' : dest === 3 ? '其他文件夹' : PLACES[dest].name;

function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1700);
}

function sheet(kind){
  const icon = kind === 'file' ? icoArchive : icoFolder;
  const rows = (kind === 'file' ? FILES : PLACES).map((it,i)=>
    '<div class="item" data-i="' + i + '">' + icon + '<span>' + it.name + '</span><span class="m">' + it.meta + '</span></div>'
  ).join('');
  el('sheet').innerHTML = '<h3>' + (kind === 'file' ? '打开压缩包' : '解压到') + '</h3>'
    + '<div class="list">' + rows + '</div>'
    + '<div class="foot"><button class="ghost" id="sheet-close">取消</button></div>';
  el('veil').classList.add('show');
  el('sheet-close').addEventListener('click', ()=>el('veil').classList.remove('show'));
  el('sheet').querySelectorAll('.item').forEach(row=>{
    row.addEventListener('click', ()=>{
      const i = Number(row.dataset.i);
      if(kind === 'file'){ setState('open'); toast('已打开 ' + FILES[i].name); }
      else if(i === 3){ toast('演示原型：这里会打开系统选目录面板'); }
      else { dest = i; renderHead(); toast('解压到 ' + PLACES[i].name); }
      el('veil').classList.remove('show');
    });
  });
}

el('veil').addEventListener('click', e=>{ if(e.target === el('veil')) el('veil').classList.remove('show'); });
el('search').addEventListener('input', e=>{ q = e.target.value; renderTable(); renderHead(); });
el('back').addEventListener('click', ()=>{ path=''; selected=null; renderAll(); });
el('btn-open').addEventListener('click', ()=>sheet('file'));
el('dropzone').addEventListener('click', ()=>sheet('file'));
el('btn-extract').addEventListener('click', ()=>{ if(state==='open' && selected!==null) setState('running'); });

function openMenu(){
  const items = [['打开压缩包…','⌘O'],['在访达显示解压结果',''],['全选','⌘A'],['复制档案路径','']];
  el('sheet').innerHTML = '<h3>更多</h3><div class="list">'
    + items.map((it,i)=>'<div class="item" data-i="' + i + '"><span>' + it[0] + '</span><span class="m">' + it[1] + '</span></div>').join('')
    + '</div><div class="foot"><button class="ghost" id="sheet-close">关闭</button></div>';
  el('veil').classList.add('show');
  el('sheet-close').addEventListener('click', ()=>el('veil').classList.remove('show'));
  el('sheet').querySelectorAll('.item').forEach(row=>row.addEventListener('click', ()=>{
    const i = Number(row.dataset.i);
    el('veil').classList.remove('show');
    if(i === 0){ sheet('file'); } else { toast('演示原型：' + items[i][0]); }
  }));
}
el('btn-more').addEventListener('click', openMenu);

renderAll();

const preset = location.hash.slice(1);
if(['empty','browse','open','running','done'].includes(preset)) setState(preset);
if(location.search.includes('os=win')) setOs('win');
</script>
</body>
</html>
